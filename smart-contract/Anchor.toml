[toolchain]
anchor_version = "0.32.1"
# Solana 3.x (platform-tools v1.52+, edition2024). Pin active_release to Agave 3.1.15 locally;
# `agave-install init 3.1.15` may report "Unknown release" — use the stable-* release dir instead.

[features]
resolution = true
skip-lint = false

[programs.localnet]
voting = "VotiNG1111111111111111111111111111111111111"

[programs.devnet]
voting = "VotiNG1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npm run test --"

[test]
startup_wait = 15000
