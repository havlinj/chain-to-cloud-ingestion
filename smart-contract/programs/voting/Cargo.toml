[package]
name = "voting"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Solana Anchor voting program (commit-reveal + Merkle registry)"

[lib]
crate-type = ["cdylib", "lib"]
name = "voting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
# Declared for Anchor macro-expanded cfgs (avoids `unexpected_cfgs` on Rust 1.80+).
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.32.1"
voting-crypto = { path = "../../crates/voting-crypto" }
