[package]
name = "voting"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Solana Anchor voting program (commit-reveal + Merkle registry)"

[lib]
crate-type = ["cdylib", "lib"]
name = "voting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
# Declared for Anchor macro-expanded cfgs (avoids `unexpected_cfgs` on Rust 1.80+).
custom-heap = []
custom-panic = []
anchor-debug = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
voting-crypto = { path = "../../crates/voting-crypto" }
