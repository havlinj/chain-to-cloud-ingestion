[package]
name = "voting"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Solana Anchor voting program (commit-reveal + Merkle registry)"

[lib]
crate-type = ["cdylib", "lib"]
name = "voting"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
voting-crypto = { path = "../../crates/voting-crypto" }
