# voting-crypto: golden fixture tests (ADR 0001 / 0003).
# voting program: host build via stable Rust (anchor-lang); anchor build/SBF optional locally.

name: Smart contract

on:
  push:
    branches: [main, master]
    paths:
      - "smart-contract/**"
      - ".github/workflows/smart-contract.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "smart-contract/**"
      - ".github/workflows/smart-contract.yml"

jobs:
  voting-crypto:
    name: voting-crypto tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.78
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt

      - name: Cargo test (voting-crypto)
        run: cargo test -p voting-crypto

  voting-program:
    name: voting program (host build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo build (voting)
        run: cargo build -p voting
