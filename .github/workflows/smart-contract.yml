# voting-crypto: golden fixture tests (ADR 0001 / 0003 algorithms).
# Anchor program build is deferred to iteration 2B (requires Anchor + Solana CLI).

name: Smart contract

on:
  push:
    branches: [main, master]
    paths:
      - "smart-contract/**"
      - ".github/workflows/smart-contract.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "smart-contract/**"
      - ".github/workflows/smart-contract.yml"

jobs:
  voting-crypto:
    name: voting-crypto tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contract

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.78
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.78.0
          components: rustfmt

      - name: Cargo test (voting-crypto)
        run: cargo test -p voting-crypto
