# Terraform: init, fmt, validate for infra/aws and infra/gcp.
# Runs on push and PR when files under infra/ change.
# No credentials required; no plan/apply in this workflow.

name: Terraform

on:
  push:
    branches: [master]
    paths: ["infra/**"]
  pull_request:
    branches: [master]
    paths: ["infra/**"]

jobs:
  validate:
    name: Validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws, gcp]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/${{ matrix.stack }}
        run: terraform init -input=false

      - name: Terraform Format Check
        working-directory: infra/${{ matrix.stack }}
        run: terraform fmt -check -recursive -diff

      - name: Terraform Validate
        working-directory: infra/${{ matrix.stack }}
        run: terraform validate
